[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "open-antenna-validation"
version = "0.1.0"
description = "Comparaison d'antennes HF par mesure simultanée ou commutée du RSSI et du SNR"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "itsdangerous>=2.1",
    "argon2-cffi>=23.1",
    "pydantic>=2.6",
    "tomli-w>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "jsonschema>=4.0",
]

[project.scripts]
oav = "open_antenna_validation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/open_antenna_validation"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "open_antenna_validation/_web"
"config/default.toml" = "open_antenna_validation/_config/default.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs a real SDR plugged in (run with: pytest -m hardware)",
    "wordpress: needs the test WordPress (OAV_WP_URL, see wordpress/dev; pytest -m wordpress)",
]
addopts = "-m 'not hardware and not wordpress' --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# French typography (×, −, –, ’) is legitimate in user-facing strings and docstrings.
ignore = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["open_antenna_validation"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
