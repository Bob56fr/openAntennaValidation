<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 150 1352 512" width="1352" height="512" role="img" aria-labelledby="title desc">
  <title id="title">openAntennaValidation : principes de mesure</title>
  <desc id="desc">Schéma en quatre parties : réception commutée et réception simultanée ; mesure du niveau, du plancher de bruit et du SNR dans la largeur de chaque classe de signal ; qualification par banc matériel et campagne A/A ; chaîne statistique jusqu'à la règle de conclusion.</desc>
  <style>
    svg { --bg:#f2f3f0; --surface:#fcfcfb; --surface-2:#f6f7f4; --ink:#121512; --ink-2:#4b514c; --muted:#7d837d;
          --line:#e1e2dc; --axis:#c3c5bd; --zone:rgba(125,131,125,.14);
          --good:#0ca30c; --warning:#fab219; --critical:#d03b3b; --good-ink:#006300;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s7:#6250d6; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0e100e; --surface:#181a18; --surface-2:#1e211e; --ink:#eef0ec; --ink-2:#c0c4bc; --muted:#8a8e88;
            --line:#2b2e2b; --axis:#3b3e3a; --zone:rgba(138,142,136,.16); --good-ink:#3cc23c;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9; }
    }
    text { font-family: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .panel { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
    .box { fill: var(--surface-2); stroke: var(--axis); stroke-width: 1.2; }
    .wire { fill: none; stroke: var(--ink-2); stroke-width: 1.6; }
    .axis { stroke: var(--axis); stroke-width: 1.2; fill: none; }
    .grid { stroke: var(--line); stroke-width: 1; }
    .bracket { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .dash { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .ant1 { fill: none; stroke: var(--s1); stroke-width: 2.4; stroke-linecap: round; }
    .ant2 { fill: none; stroke: var(--s2); stroke-width: 2.4; stroke-linecap: round; }
    .ant3 { fill: none; stroke: var(--s3); stroke-width: 2.4; stroke-linecap: round; }
    .mk1 { fill: var(--s1); } .mk2 { fill: var(--s2); } .mk3 { fill: var(--s3); }
    .fa { fill: var(--s1); } .fb { fill: var(--s2); }
    .onfill { fill: #fff; }
    .env1 { fill: none; stroke: var(--s1); stroke-width: 2.2; stroke-linejoin: round; }
    .env2 { fill: none; stroke: var(--s2); stroke-width: 2.2; stroke-dasharray: 7 3; stroke-linejoin: round; }
    .spec { fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-linejoin: round; }
    .specfill { fill: url(#specgrad); }
    .meas { fill: var(--s1); fill-opacity: .13; stroke: var(--s1); stroke-opacity: .55; stroke-width: 1; stroke-dasharray: 3 3; }
    .floor { stroke: var(--s3); stroke-width: 2; stroke-dasharray: 6 4; }
    .calib { fill: none; stroke: var(--s7); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .hist { fill: var(--s7); fill-opacity: .75; }
    .zone { fill: var(--zone); }
    .ci { stroke: var(--s1); stroke-width: 2.2; stroke-linecap: round; }
    .pt { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
    .arrow { stroke: var(--ink-2); stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    .arrowb { stroke: var(--ink-2); stroke-width: 1.4; fill: none; marker-end: url(#arr); marker-start: url(#arrs); }
    .num { fill: var(--ink); }
    .numt { fill: var(--surface); font-weight: 600; font-size: 14px; text-anchor: middle; }
    .h1 { font-size: 34px; font-weight: 600; letter-spacing: -.01em; }
    .h2 { font-size: 21px; font-weight: 600; }
    .h3 { font-size: 17px; font-weight: 600; }
    .eyebrow { font-family: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: .08em; fill: var(--muted); }
    .sub { font-size: 16px; fill: var(--ink-2); }
    .t11 { font-size: 11px; } .t12 { font-size: 12px; } .t13 { font-size: 13px; } .t14 { font-size: 14px; } .t15 { font-size: 15px; }
    .b { font-weight: 600; } .m { fill: var(--muted); } .i2 { fill: var(--ink-2); }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
    .c1 { fill: var(--s1); } .c2 { fill: var(--s2); } .c3 { fill: var(--s3); } .c7 { fill: var(--s7); }
    .good { fill: var(--good-ink); }
    .tag { fill: var(--surface-2); stroke: var(--line); }
    .dot-good { fill: var(--good); } .dot-warn { fill: var(--warning); } .dot-crit { fill: var(--critical); }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff" fill-opacity=".55"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#121512" stroke-opacity=".45" stroke-width="2"/>
    </pattern>
    <pattern id="hatchn" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1baf7a" stroke-opacity=".6" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="specgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d837d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7d837d" stop-opacity=".02"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#7d837d"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,1 L1,5 L10,9 z" fill="#7d837d"/>
    </marker>
    <path id="antenna" d="M0,0 V-30 M0,-30 L-13,-46 M0,-30 L13,-46 M0,-30 V-48"/>
  </defs>

  <rect class="bg" x="24" y="150" width="1352" height="512" rx="12"/>
  <text x="48" y="187" class="h2">Deux façons d'acquérir les signaux</text>

  <!-- 1A Réception commutée -->
  <rect x="48" y="206" width="632" height="440" rx="10" class="panel"/>
  <text x="72" y="240" class="h3">Réception commutée</text>
  <rect x="254" y="224" width="130" height="24" rx="12" class="tag"/>
  <text x="319" y="241" class="t12 mid i2">1 SDR · 2 entrées</text>

  <use href="#antenna" x="100" y="314" class="ant1"/>
  <circle cx="76" cy="300" r="6" class="mk1"/><text x="70" y="330" class="t13 b c1">A</text>
  <use href="#antenna" x="100" y="404" class="ant2"/>
  <rect x="70" y="384" width="12" height="12" class="mk2"/><text x="70" y="420" class="t13 b c2">B</text>
  <path d="M100,314 H260" class="wire"/>
  <path d="M100,404 H260" class="wire"/>
  <text x="180" y="306" class="t11 m mid">câble, pertes connues</text>

  <rect x="250" y="276" width="200" height="160" rx="8" class="box"/>
  <text x="350" y="298" class="t13 b mid">SDRplay RSP2 Pro</text>
  <circle cx="276" cy="314" r="4" class="mk1"/>
  <circle cx="276" cy="404" r="4" class="mk2"/>
  <circle cx="324" cy="359" r="4" fill="var(--ink-2)"/>
  <path d="M324,359 L279,317" class="wire" stroke-width="2.4"/>
  <path d="M300,330 A40,40 0 0 0 300,388" class="dash" marker-end="url(#arr)" marker-start="url(#arrs)"/>
  <path d="M324,359 H364" class="wire"/>
  <rect x="364" y="340" width="70" height="38" rx="4" fill="var(--surface)" stroke="var(--axis)"/>
  <text x="399" y="356" class="t11 mid">tuner</text><text x="399" y="370" class="t11 mid">+ CAN</text>
  <text x="340" y="424" class="t11 m mid">bascule A ⇄ B</text>

  <path d="M450,359 H492" class="arrow"/>
  <text x="502" y="345" class="t13 b">Un seul récepteur</text>
  <text x="502" y="364" class="t13 i2">même gain, même chaîne :</text>
  <text x="502" y="382" class="t13 i2">pas d'écart entre récepteurs</text>

  <text x="80" y="456" class="t12 b">Chronogramme · 25 bascules/s, 20 ms par entrée</text>
  <rect x="540" y="445" width="16" height="12" fill="url(#hatch)" stroke="var(--axis)"/>
  <text x="562" y="456" class="t12 m">neutralisé</text>
  <rect x="80" y="466" width="70" height="30" class="fa"/>
    <rect x="80" y="466" width="17.5" height="30" fill="url(#hatch)"/>
    <text x="124" y="486" class="t13 b mid onfill">A</text>
    <rect x="150" y="466" width="70" height="30" class="fb"/>
    <rect x="150" y="466" width="17.5" height="30" fill="url(#hatch)"/>
    <text x="194" y="486" class="t13 b mid onfill">B</text>
    <rect x="220" y="466" width="70" height="30" class="fa"/>
    <rect x="220" y="466" width="17.5" height="30" fill="url(#hatch)"/>
    <text x="264" y="486" class="t13 b mid onfill">A</text>
    <rect x="290" y="466" width="70" height="30" class="fb"/>
    <rect x="290" y="466" width="17.5" height="30" fill="url(#hatch)"/>
    <text x="334" y="486" class="t13 b mid onfill">B</text>
    <rect x="360" y="466" width="70" height="30" class="fa"/>
    <rect x="360" y="466" width="17.5" height="30" fill="url(#hatch)"/>
    <text x="404" y="486" class="t13 b mid onfill">A</text>
    <rect x="430" y="466" width="70" height="30" class="fb"/>
    <rect x="430" y="466" width="17.5" height="30" fill="url(#hatch)"/>
    <text x="474" y="486" class="t13 b mid onfill">B</text>
    <rect x="500" y="466" width="70" height="30" class="fa"/>
    <rect x="500" y="466" width="17.5" height="30" fill="url(#hatch)"/>
    <text x="544" y="486" class="t13 b mid onfill">A</text>
    <rect x="570" y="466" width="70" height="30" class="fb"/>
    <rect x="570" y="466" width="17.5" height="30" fill="url(#hatch)"/>
    <text x="614" y="486" class="t13 b mid onfill">B</text>
    <line x1="80" y1="496" x2="80" y2="502" class="axis"/>
    <text x="80" y="516" class="t11 m mid mono">0</text>
    <line x1="150" y1="496" x2="150" y2="502" class="axis"/>
    <text x="150" y="516" class="t11 m mid mono">20</text>
    <line x1="220" y1="496" x2="220" y2="502" class="axis"/>
    <text x="220" y="516" class="t11 m mid mono">40</text>
    <line x1="290" y1="496" x2="290" y2="502" class="axis"/>
    <text x="290" y="516" class="t11 m mid mono">60</text>
    <line x1="360" y1="496" x2="360" y2="502" class="axis"/>
    <text x="360" y="516" class="t11 m mid mono">80</text>
    <line x1="430" y1="496" x2="430" y2="502" class="axis"/>
    <text x="430" y="516" class="t11 m mid mono">100</text>
    <line x1="500" y1="496" x2="500" y2="502" class="axis"/>
    <text x="500" y="516" class="t11 m mid mono">120</text>
    <line x1="570" y1="496" x2="570" y2="502" class="axis"/>
    <text x="570" y="516" class="t11 m mid mono">140</text>
    <line x1="640" y1="496" x2="640" y2="502" class="axis"/>
    <text x="640" y="516" class="t11 m mid mono">160</text>
    <path d="M124,526 v7 H194 v-7" class="bracket"/>
    <path d="M264,526 v7 H334 v-7" class="bracket"/>
    <path d="M404,526 v7 H474 v-7" class="bracket"/>
    <path d="M544,526 v7 H614 v-7" class="bracket"/>
  <text x="658" y="516" class="t11 m">ms</text>
  <text x="80" y="552" class="t12 m">paires adjacentes A → B</text>

  <text x="80" y="584" class="t13 i2">• Après chaque bascule : neutralisation = latence + établissement (mesurés au banc).</text>
  <text x="80" y="606" class="t13 i2">• Appariement A → B, ou pivot : B contre la moyenne des A qui l'encadrent.</text>
  <text x="80" y="628" class="t13 i2">• Limite : la voix (SSB) varie trop vite ; verdict donné par classe de signal.</text>

  <!-- 1B Réception simultanée -->
  <rect x="720" y="206" width="632" height="440" rx="10" class="panel"/>
  <text x="744" y="240" class="h3">Réception simultanée</text>
  <rect x="926" y="224" width="200" height="24" rx="12" class="tag"/>
  <text x="1026" y="241" class="t12 mid i2">1 SDR par antenne · 2 à 10</text>

  <use href="#antenna" x="772" y="306" class="ant1"/>
  <circle cx="748" cy="292" r="6" class="mk1"/>
  <use href="#antenna" x="772" y="366" class="ant2"/>
  <rect x="742" y="346" width="12" height="12" class="mk2"/>
  <use href="#antenna" x="772" y="426" class="ant3"/>
  <path d="M748,400 l7,12 h-14 z" class="mk3"/>
  <path d="M772,306 H860 M772,366 H860 M772,426 H860" class="wire"/>
  <rect x="848" y="280" width="172" height="172" rx="10" class="calib"/>
  <text x="934" y="273" class="t12 b mid c7">étalonnés entre eux en amont</text>
  <rect x="860" y="290" width="148" height="32" rx="6" class="box"/>
  <text x="934" y="311" class="t13 mid">RSP2 Pro</text>
  <rect x="860" y="350" width="148" height="32" rx="6" class="box"/>
  <text x="934" y="371" class="t13 mid">RTL-SDR Blog V4</text>
  <rect x="860" y="410" width="148" height="32" rx="6" class="box"/>
  <text x="934" y="431" class="t13 mid">Airspy HF+</text>
  <path d="M1008,306 C1040,306 1040,366 1064,366 M1008,366 H1064 M1008,426 C1040,426 1040,366 1064,366" class="wire"/>
  <path d="M1064,366 H1080" class="arrow"/>
  <text x="1092" y="340" class="t13 b">Même instant</text>
  <text x="1092" y="359" class="t13 i2">horloge = compteur</text>
  <text x="1092" y="377" class="t13 i2">d'échantillons, un</text>
  <text x="1092" y="395" class="t13 i2">processus par SDR</text>
  <text x="1092" y="420" class="t12 m">modèles mélangeables</text>
  <text x="1092" y="436" class="t12 m">(campagne « hétérogène »)</text>

  <text x="780" y="470" class="t12 b">Alignement des flux · enveloppes de puissance d'un même signal</text>
  <path d="M780,566 H1320" class="axis"/>
