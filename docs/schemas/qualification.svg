<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 1124 1352 420" width="1352" height="420" role="img" aria-labelledby="title desc">
  <title id="title">openAntennaValidation : principes de mesure</title>
  <desc id="desc">Schéma en quatre parties : réception commutée et réception simultanée ; mesure du niveau, du plancher de bruit et du SNR dans la largeur de chaque classe de signal ; qualification par banc matériel et campagne A/A ; chaîne statistique jusqu'à la règle de conclusion.</desc>
  <style>
    svg { --bg:#f2f3f0; --surface:#fcfcfb; --surface-2:#f6f7f4; --ink:#121512; --ink-2:#4b514c; --muted:#7d837d;
          --line:#e1e2dc; --axis:#c3c5bd; --zone:rgba(125,131,125,.14);
          --good:#0ca30c; --warning:#fab219; --critical:#d03b3b; --good-ink:#006300;
          --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s7:#6250d6; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0e100e; --surface:#181a18; --surface-2:#1e211e; --ink:#eef0ec; --ink-2:#c0c4bc; --muted:#8a8e88;
            --line:#2b2e2b; --axis:#3b3e3a; --zone:rgba(138,142,136,.16); --good-ink:#3cc23c;
            --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9; }
    }
    text { font-family: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .panel { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
    .box { fill: var(--surface-2); stroke: var(--axis); stroke-width: 1.2; }
    .wire { fill: none; stroke: var(--ink-2); stroke-width: 1.6; }
    .axis { stroke: var(--axis); stroke-width: 1.2; fill: none; }
    .grid { stroke: var(--line); stroke-width: 1; }
    .bracket { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .dash { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .ant1 { fill: none; stroke: var(--s1); stroke-width: 2.4; stroke-linecap: round; }
    .ant2 { fill: none; stroke: var(--s2); stroke-width: 2.4; stroke-linecap: round; }
    .ant3 { fill: none; stroke: var(--s3); stroke-width: 2.4; stroke-linecap: round; }
    .mk1 { fill: var(--s1); } .mk2 { fill: var(--s2); } .mk3 { fill: var(--s3); }
    .fa { fill: var(--s1); } .fb { fill: var(--s2); }
    .onfill { fill: #fff; }
    .env1 { fill: none; stroke: var(--s1); stroke-width: 2.2; stroke-linejoin: round; }
    .env2 { fill: none; stroke: var(--s2); stroke-width: 2.2; stroke-dasharray: 7 3; stroke-linejoin: round; }
    .spec { fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-linejoin: round; }
    .specfill { fill: url(#specgrad); }
    .meas { fill: var(--s1); fill-opacity: .13; stroke: var(--s1); stroke-opacity: .55; stroke-width: 1; stroke-dasharray: 3 3; }
    .floor { stroke: var(--s3); stroke-width: 2; stroke-dasharray: 6 4; }
    .calib { fill: none; stroke: var(--s7); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .hist { fill: var(--s7); fill-opacity: .75; }
    .zone { fill: var(--zone); }
    .ci { stroke: var(--s1); stroke-width: 2.2; stroke-linecap: round; }
    .pt { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
    .arrow { stroke: var(--ink-2); stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    .arrowb { stroke: var(--ink-2); stroke-width: 1.4; fill: none; marker-end: url(#arr); marker-start: url(#arrs); }
    .num { fill: var(--ink); }
    .numt { fill: var(--surface); font-weight: 600; font-size: 14px; text-anchor: middle; }
    .h1 { font-size: 34px; font-weight: 600; letter-spacing: -.01em; }
    .h2 { font-size: 21px; font-weight: 600; }
    .h3 { font-size: 17px; font-weight: 600; }
    .eyebrow { font-family: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: .08em; fill: var(--muted); }
    .sub { font-size: 16px; fill: var(--ink-2); }
    .t11 { font-size: 11px; } .t12 { font-size: 12px; } .t13 { font-size: 13px; } .t14 { font-size: 14px; } .t15 { font-size: 15px; }
    .b { font-weight: 600; } .m { fill: var(--muted); } .i2 { fill: var(--ink-2); }
    .mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
    .c1 { fill: var(--s1); } .c2 { fill: var(--s2); } .c3 { fill: var(--s3); } .c7 { fill: var(--s7); }
    .good { fill: var(--good-ink); }
    .tag { fill: var(--surface-2); stroke: var(--line); }
    .dot-good { fill: var(--good); } .dot-warn { fill: var(--warning); } .dot-crit { fill: var(--critical); }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#ffffff" fill-opacity=".55"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#121512" stroke-opacity=".45" stroke-width="2"/>
    </pattern>
    <pattern id="hatchn" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1baf7a" stroke-opacity=".6" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="specgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d837d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7d837d" stop-opacity=".02"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#7d837d"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,1 L1,5 L10,9 z" fill="#7d837d"/>
    </marker>
    <path id="antenna" d="M0,0 V-30 M0,-30 L-13,-46 M0,-30 L13,-46 M0,-30 V-48"/>
  </defs>

  <rect class="bg" x="24" y="1124" width="1352" height="420" rx="12"/>
  <text x="48" y="1161" class="h2">Qualification : chiffrer l'erreur de la méthode avant de mesurer</text>

  <!-- 3A Banc matériel -->
  <rect x="48" y="1180" width="632" height="350" rx="10" class="panel"/>
  <text x="72" y="1214" class="h3">Banc matériel</text>
  <rect x="200" y="1198" width="200" height="24" rx="12" class="tag"/>
  <text x="300" y="1215" class="t12 mid i2">mode commuté · quelques minutes</text>

  <rect x="72" y="1244" width="132" height="44" rx="6" class="box"/>
  <text x="138" y="1263" class="t12 mid">générateur</text><text x="138" y="1279" class="t12 mid">de bruit</text>
  <path d="M204,1266 H246" class="wire"/>
  <path d="M246,1250 L276,1266 L246,1282 Z" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="1.4"/>
  <text x="261" y="1302" class="t11 m mid">splitter</text>
  <path d="M276,1266 C296,1266 296,1246 316,1246 H470" class="wire"/>
  <path d="M276,1266 C296,1266 296,1286 316,1286 H346 M410,1286 H470" class="wire"/>
  <rect x="346" y="1272" width="64" height="28" rx="4" fill="var(--surface)" stroke="var(--s2)" stroke-width="1.6"/>
  <text x="378" y="1291" class="t12 b mid c2">−10 dB</text>
  <text x="440" y="1240" class="t11 c1 b mid">A</text><text x="440" y="1280" class="t11 c2 b mid">B</text>
  <rect x="470" y="1234" width="110" height="64" rx="6" class="box"/>
  <text x="525" y="1262" class="t13 b mid">RSP2 Pro</text><text x="525" y="1280" class="t12 m mid">bascule A ⇄ B</text>

  <!-- marche observée -->
  <line x1="90" y1="1450" x2="640" y2="1450" class="axis"/>
  <line x1="90" y1="1326" x2="90" y2="1450" class="axis"/>
  <text x="96" y="1340" class="t11 m">niveau</text>
  <rect x="300" y="1405" width="330" height="10" class="zone"/>
  <path d="M90,1350 H300 L304,1328 L310,1426 L316,1398 L322,1416 L330,1406 L340,1411 L352,1409.5 H630" fill="none" stroke="var(--s1)" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="280" y1="1336" x2="280" y2="1450" class="dash"/>
  <text x="276" y="1464" class="t11 m end">commande</text>
  <path d="M280,1436 H300" class="bracket"/>
  <path d="M300,1436 H352" class="bracket"/>
  <line x1="300" y1="1430" x2="300" y2="1442" class="bracket"/><line x1="352" y1="1430" x2="352" y2="1442" class="bracket"/>
  <text x="290" y="1478" class="t12 i2 mid">latence</text>
  <text x="360" y="1464" class="t12 i2">établissement à ±0,2 dB</text>
  <path d="M598,1353 V1404" class="arrowb"/>
  <text x="590" y="1384" class="t12 b end">justesse : 10 dB ?</text>

  <text x="72" y="1508" class="t13 i2">→ durée de neutralisation et fraction utile ; aussi isolation des entrées, plancher sur charge 50 Ω.</text>

  <!-- 3B Campagne A/A -->
  <rect x="720" y="1180" width="632" height="350" rx="10" class="panel"/>
  <text x="744" y="1214" class="h3">Campagne A/A</text>
  <rect x="868" y="1198" width="190" height="24" rx="12" class="tag"/>
  <text x="963" y="1215" class="t12 mid i2">les deux modes · 1 h à 24 h</text>

  <use href="#antenna" x="772" y="1290" class="ant1"/>
  <path d="M772,1290 H806" class="wire"/>
  <path d="M806,1274 L836,1290 L806,1306 Z" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="1.4"/>
  <path d="M836,1290 C852,1290 852,1250 870,1250 H890 M836,1290 H890 M836,1290 C852,1290 852,1330 870,1330 H890" class="wire"/>
  <rect x="890" y="1238" width="96" height="24" rx="5" class="box"/><text x="938" y="1255" class="t12 mid">SDR 1 · réf.</text>
  <rect x="890" y="1278" width="96" height="24" rx="5" class="box"/><text x="938" y="1295" class="t12 mid">SDR 2</text>
  <rect x="890" y="1318" width="96" height="24" rx="5" class="box"/><text x="938" y="1335" class="t12 mid">SDR N</text>
  <text x="1010" y="1272" class="t15 b">Écart vrai = 0</text>
  <text x="1010" y="1292" class="t13 i2">tout écart mesuré est</text>
  <text x="1010" y="1310" class="t13 i2">l'erreur de la méthode</text>

  <path d="M859.6,1360 V1440 M994.0,1360 V1440" class="dash"/>
  <path d="M859.6,1366 H994.0" class="arrowb"/>
  <text x="910" y="1356" class="t12 b mid">marge = |biais| + 2σ</text>
  <rect x="862.0" y="1435.8" width="12" height="4.2" rx="1.5" class="hist"/>
    <rect x="876.0" y="1426.8" width="12" height="13.2" rx="1.5" class="hist"/>
    <rect x="890.0" y="1409.7" width="12" height="30.3" rx="1.5" class="hist"/>
    <rect x="904.0" y="1388.8" width="12" height="51.2" rx="1.5" class="hist"/>
    <rect x="918.0" y="1376.4" width="12" height="63.6" rx="1.5" class="hist"/>
    <rect x="932.0" y="1382.0" width="12" height="58.0" rx="1.5" class="hist"/>
    <rect x="946.0" y="1401.2" width="12" height="38.8" rx="1.5" class="hist"/>
    <rect x="960.0" y="1420.9" width="12" height="19.1" rx="1.5" class="hist"/>
    <rect x="974.0" y="1433.1" width="12" height="6.9" rx="1.5" class="hist"/>
    <rect x="988.0" y="1438.2" width="12" height="1.8" rx="1.5" class="hist"/>
  <line x1="770" y1="1440" x2="1050" y2="1440" class="axis"/>
  <line x1="910" y1="1440" x2="910" y2="1446" class="axis"/>
  <text x="910" y="1460" class="t11 m mid mono">0 dB</text>
  <text x="1050" y="1460" class="t11 m end">écart B − A par fenêtre</text>

  <text x="1090" y="1366" class="eyebrow">VERDICT PAR CLASSE · EXEMPLE</text>
  <circle cx="1096" cy="1386" r="5" class="dot-good"/><text x="1108" y="1391" class="t13">Porteuse / CW</text>
  <circle cx="1096" cy="1408" r="5" class="dot-good"/><text x="1108" y="1413" class="t13">Numérique étroit</text>
  <circle cx="1096" cy="1430" r="5" class="dot-warn"/><text x="1108" y="1435" class="t13">AM : dégradé</text>
  <circle cx="1096" cy="1452" r="5" class="dot-crit"/><text x="1108" y="1457" class="t13">SSB : inexploitable</text>

  <text x="744" y="1508" class="t13 i2">→ biais corrigé par fréquence ; la marge de chaque classe accompagne les campagnes.</text>

</svg>
