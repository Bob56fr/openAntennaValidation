# Configuration par défaut de la station openAntennaValidation.
# Copie de référence : les valeurs effectives par défaut sont définies dans
# src/open_antenna_validation/config.py et un test vérifie que les deux restent identiques.
# Le fichier local (config.toml dans le répertoire de la station) ne contient
# que les valeurs à surcharger.

[station]
id = ""                       # généré par « oav init »
name = "Station openAntennaValidation"
callsign = ""                 # indicatif de l'opérateur
locator = ""                  # locator Maidenhead, 4 ou 6 caractères (ex. JN18eu)
timezone = "Europe/Paris"     # fuseau horaire de la station (heures locales des résultats)

[hardware]
driver = "sdrplay"            # "sdrplay", "rtlsdr", "airspyhf" ou "simulated"
serial = ""                   # vide : premier appareil détecté
sample_rate = 250000          # S/s voulus : chaque SDR prend sa plus basse fréquence possible au-dessus
antenna = ""                  # RSP2 : A ou B ; RSPdx : A, B ou C ; vide : défaut de l'appareil
ppm = 0.0
bias_tee = false
# gain_step = 20              # pas de gain retenu avant une campagne
others = []                   # mode simultané : les autres SDR ([[hardware.others]] : serial, driver, antenna)

[hardware.sdrplay]
lna_state = 0                 # état LNA fixe pendant une série de mesures
library_path = ""             # vide : emplacements d'installation standard

[hardware.rtlsdr]
library_path = ""             # librtlsdr de la branche RTL-SDR Blog ; vide : emplacements standard

[hardware.airspyhf]
lna = false                   # préampli +6 dB, fixe pendant une série de mesures
library_path = ""             # vide : emplacements d'installation standard

[hardware.simulated]
serial = "SIM0001"
signal_offset_db = 0.0        # antenne de ce SDR par rapport à l'air (signaux)…
noise_offset_db = 0.0         # …et bruit
gain_error_db = 0.0           # erreur de gain du récepteur (corrigée par l'étalonnage)
noise_dbfs = -95.0            # plancher de bruit de l'antenne A
air_center_hz = 7100000.0     # les signaux simulés sont à cette fréquence + leur décalage
seed = 1
realtime = true               # cadence d'un vrai récepteur
antenna_b_signal_db = -3.0    # antenne B par rapport à A, sur les signaux…
antenna_b_noise_db = 1.0      # …et sur le bruit
fading_db = 6.0               # évanouissement lent commun aux deux antennes (crête)
fading_period_s = 20.0
switch_latency_ms = 1.4       # bascule d'antenne simulée : délai…
switch_glitch_db = 6.0        # …parasite…
switch_settle_ms = 1.6        # …et temps d'établissement

[[hardware.simulated.signals]]  # signaux HF simulés, décalés par rapport au centre
offset_hz = -62000.0
kind = "carrier"              # "carrier", "ssb" ou "ft8"
dbfs = -62.0

[[hardware.simulated.signals]]
offset_hz = -26000.0
kind = "ft8"
dbfs = -72.0

[[hardware.simulated.signals]]
offset_hz = -10000.0
kind = "ssb"
dbfs = -58.0

[[hardware.simulated.signals]]
offset_hz = 45000.0
kind = "ssb"
dbfs = -66.0

[receiver]
center_frequency_hz = 7100000.0  # fréquence écoutée hors campagne (tableau de bord)
dc_offset_hz = 0.0            # décalage d'accord pour écarter le pic DC des signaux mesurés

[spectrum]
fft_size = 4096               # 1024, 2048, 4096 ou 8192 points
fps = 5.0                     # images par seconde envoyées à la page
block_ms = 100                # durée des blocs IQ traités
display_points = 1024         # points par spectre affiché (maximum par groupe de cases)
clip_threshold = 0.99         # fraction de la pleine échelle
clip_alert_ratio = 0.001      # alerte au-delà de 0,1 % d'échantillons écrêtés

# Plan de bandes : IARU Région 1, CB, 45 m et 85 m (cahier des charges, section 3).
