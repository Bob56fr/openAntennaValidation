[qualification]
switches = 400                # bascules enregistrées par mesure
dwell_ms = 10.0               # durée sur chaque entrée entre deux bascules
levels_seconds = 4.0          # durée des mesures de niveau (entrées alternées)
subbands = 16                 # sous-bandes du déséquilibre en fonction de la fréquence
tolerance_db = 0.2            # établissement : retour à ± cette valeur du niveau final
step_min_db = 6.0             # marche minimale pour repérer la bascule dans le flux
blanking_margin_ms = 0.2      # marge ajoutée à la neutralisation (latence p99 + établissement)
attenuator_db = 10.0          # valeur par défaut de l'atténuateur du banc
switch_rate_hz = 25.0         # cadence de commutation rapide par défaut des campagnes
useful_ok = 0.7               # temps utile au-dessus duquel une classe est exploitable
useful_min = 0.4              # en dessous : inexploitable ; entre les deux : dégradée
validity_days = 180           # durée de validité d'un profil

[qualification.class_rate_hz]  # cadence de commutation nécessaire par classe de signal
carrier = 2.0
digital = 2.0
ssb = 20.0

[campaign]
period_s = 10.0               # une mesure par signal et par voie au plus toutes les N s
presence_db = 6.0             # signal présent s'il dépasse son plancher local de N dB
calm_after_s = 300.0          # bande calme si aucun signal présent pendant N s
default_blanking_ms = 5.0     # neutralisation après bascule sans profil de qualification
max_duration_days = 31.0
survey_s = 60.0               # bande automatique : durée du relevé de la bande
detect_db = 8.0               # signal détecté s'il dépasse le plancher local de N dB
max_signals = 8               # signaux suivis au plus
reevaluate_s = 3600.0         # nouveau relevé de la bande toutes les N s
calm_probe_s = 300.0          # bande calme : nouveau relevé toutes les N s…
calm_period_s = 60.0          # …et une mesure toutes les N s seulement
align_tolerance_ms = 5.0      # mode simultané : écart maximal entre SDR pour apparier la voix
load_test_s = 30.0            # test de charge avant lancement
load_ok = 0.7                 # charge (part d'un cœur, ou de la machine) : OK en dessous…
load_max = 0.85               # …lancement possible après acceptation en dessous, refus au-delà
# (durée de campagne jusqu'à N heures, fenêtre d'agrégation en secondes)
windows = [[1.0, 10.0], [24.0, 60.0], [168.0, 300.0], [1000000000.0, 900.0]]

[campaign.class_width_hz]      # largeur de mesure par défaut selon la classe
carrier = 200.0
digital = 100.0
ssb = 2700.0
am_fm = 8000.0

[demo]
enabled = true                # campagnes de démonstration tant qu'aucune vraie campagne n'existe

[wordpress]
enabled = false               # publication des campagnes sur le site (plugin open-antenna-validation)
url = ""                      # adresse du site, par exemple https://www.exemple.fr
token = ""                    # jeton de la station, créé par l'opérateur dans l'administration du site
interval_s = 300.0            # un envoi toutes les N s
timeout_s = 30.0
retry_max_s = 3600.0          # après un échec : nouvel essai à délai croissant, au plus N s
locator_chars = 4             # locator publié : 4 caractères (environ 100 km)
batch_rows = 20000            # fenêtres par requête
package_fill = 0.8            # part de la taille de paquet du site qu'une campagne peut viser

[web]
host = "0.0.0.0"              # réseau local ; ne pas exposer directement sur Internet
port = 8660
password_hash = ""            # « oav set-password »
session_secret = ""           # généré par « oav init »
session_max_age_hours = 12
https_only = false            # true derrière un proxy HTTPS (cookie Secure)

[storage]
database = "oav.sqlite3"
raw_retention_days = 90       # mesures brutes gardées après la fin de la campagne

[logging]
level = "INFO"
file = "logs/oav.log"
max_bytes = 5000000
backup_count = 5
