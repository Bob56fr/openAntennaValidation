low_hz = 6610000.0
high_hz = 6710000.0
note = "6,660 MHz ± 50 kHz"

[[bands]]
name = "40 m"
low_hz = 7000000.0
high_hz = 7200000.0
note = ""

[[bands]]
name = "30 m"
low_hz = 10100000.0
